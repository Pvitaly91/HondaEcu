name: build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"

    steps:
      - name: Historical M2br QA on exact 2657bb8 source
        uses: actions/checkout@v4
        with:
          ref: 2657bb8ae3add410e693d988bac7ccf5cece7f50
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reject tracked ROM and reverse-engineering artifacts
        shell: pwsh
        run: |
          $forbidden = @(git ls-files -- '*.bin' '*.rom' '*.hex' '*.eep' '*.dump' '*.gzf' '*.rep' '*.gpr' '*.gpr.bak' '*.db' '*.trace' '*.exe' '*.dll' '*.pdb' '*.zip' 'artifacts/**')
          if ($forbidden.Count -gt 0) {
            throw "Forbidden public artifacts are tracked: $($forbidden -join ', ')"
          }

      - name: Restore
        run: dotnet restore HondaEcu.sln

      - name: Set up pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt

      - name: HistoricalPinnedBaselineQA exact M2bo checkout
        uses: actions/checkout@v4
        with:
          ref: 1ceec589ee8586727fb16a39fd15875444d6feab
          path: .tmp/m2br-owned/trees/m2bo
          fetch-depth: 1
          persist-credentials: false

      - name: M2bpPinnedBaselineQA exact immutable checkout
        uses: actions/checkout@v4
        with:
          ref: ecc32ea7b65020075f8403a4d4c81cdce4d0f0ad
          path: .tmp/m2br-owned/trees/m2bp
          fetch-depth: 0
          persist-credentials: false

      - name: M2bqPinnedBaselineQA exact immutable checkout
        uses: actions/checkout@v4
        with:
          ref: d5431f446d1951ee311aedc7961139ba28224a9f
          path: .tmp/m2br-owned/trees/m2bq
          fetch-depth: 0
          persist-credentials: false

      - name: M2br lock independent invented transfer expectations before CPU observations
        shell: pwsh
        run: |
          python -B research/p28-word0196/validate_production_transfer.py --historical-root .tmp/m2br-owned/trees/m2bo --pinned-bp-root .tmp/m2br-owned/trees/m2bp --pinned-bq-root .tmp/m2br-owned/trees/m2bq --output-dir .tmp/m2br-owned/public-evidence/transfer --target-dir .tmp/m2br-owned/runtime-target/transfer --m2bq-canonical .tmp/m2br-owned/public-evidence/compatibility/composite/active-positive-canonical.jsonl.gz --m2bq-summary .tmp/m2br-owned/public-evidence/compatibility/composite/summary.json --m2bq-freeze .tmp/m2br-owned/public-evidence/compatibility/composite/pre-runtime-freeze.json --lock-independent-expected
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch exact locked Rust registry dependencies after independent authority lock
        shell: pwsh
        run: |
          cargo +1.85.1 fetch --locked --manifest-path .tmp/m2br-owned/trees/m2bq/rust/p28-slice-runner/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.85.1 fetch --locked --manifest-path research/p28-word0196/rust-production-transfer/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bp pinned independent default and opt-in freezes
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bp
        run: |
          python -B research/p28-word0196/default_mode_compatibility.py --baseline-root ../m2bo --active-root . --output-dir .tmp/m2bp-public-evidence/default --target-dir .tmp/m2bp-default-target --freeze-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/validate_production_optin_capabilities.py --historical-root ../m2bo --output-dir .tmp/m2bp-public-evidence/optin --target-dir .tmp/m2bp-optin-target --freeze-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bq independent composite and compatibility freezes before new CPU observations
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bq
        run: |
          python -B research/p28-word0196/validate_production_composite.py --historical-root ../m2bo --pinned-root ../m2bp --output-dir .tmp/m2bq-public-evidence/composite --target-dir .tmp/m2bq-runtime-target --freeze-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/production_composite_compatibility.py --historical-root ../m2bo --pinned-root ../m2bp --output-dir .tmp/m2bq-public-evidence/compatibility --target-dir .tmp/m2bq-optin-target --composite-freeze .tmp/m2bq-public-evidence/composite/pre-runtime-freeze.json --pinned-optin-output ../m2bp/.tmp/m2bp-public-evidence/optin --freeze-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2br compatibility freeze with locked independent transfer authority
        shell: pwsh
        run: |
          python -B research/p28-word0196/production_transfer_compatibility.py --pinned-root .tmp/m2br-owned/trees/m2bq --pinned-m2bp-root .tmp/m2br-owned/trees/m2bp --historical-root .tmp/m2br-owned/trees/m2bo --output-dir .tmp/m2br-owned/public-evidence/compatibility --target-dir .tmp/m2br-owned/targets/compatibility --pinned-compatibility-output .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/compatibility --pinned-composite-output .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/composite --transfer-expectation-lock .tmp/m2br-owned/public-evidence/transfer/independent-expectation-lock.json --freeze-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2br final peer-bound transfer freeze before active CPU observations
        shell: pwsh
        run: |
          python -B research/p28-word0196/validate_production_transfer.py --historical-root .tmp/m2br-owned/trees/m2bo --pinned-bp-root .tmp/m2br-owned/trees/m2bp --pinned-bq-root .tmp/m2br-owned/trees/m2bq --output-dir .tmp/m2br-owned/public-evidence/transfer --target-dir .tmp/m2br-owned/runtime-target/transfer --m2bq-canonical .tmp/m2br-owned/public-evidence/compatibility/composite/active-positive-canonical.jsonl.gz --m2bq-summary .tmp/m2br-owned/public-evidence/compatibility/composite/summary.json --m2bq-freeze .tmp/m2br-owned/public-evidence/compatibility/composite/pre-runtime-freeze.json --freeze-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust build and instruction tests (synthetic only)
        shell: pwsh
        run: |
          function Assert-RustSuccess {
            if ($LASTEXITCODE -ne 0) {
              $diagnostic = (Get-Content rust-qa.log -Raw) -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Host "::error title=Rust QA failed::$diagnostic"
              exit $LASTEXITCODE
            }
          }
          cargo +1.85.1 build --release --locked --manifest-path rust/p28-slice-runner/Cargo.toml 2>&1 | Tee-Object -FilePath rust-qa.log
          Assert-RustSuccess
          cargo +1.85.1 test --release --locked --manifest-path rust/p28-slice-runner/Cargo.toml 2>&1 | Tee-Object -FilePath rust-qa.log -Append
          Assert-RustSuccess
          cargo +1.85.1 fmt --check --manifest-path rust/p28-slice-runner/Cargo.toml 2>&1 | Tee-Object -FilePath rust-qa.log -Append
          Assert-RustSuccess

      - name: Preserve public Rust diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-qa-${{ matrix.os }}
          path: rust-qa.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Build (Release)
        run: dotnet build HondaEcu.sln --configuration Release --no-restore

      - name: Test .NET and real Rust process end-to-end (synthetic only)
        run: dotnet test HondaEcu.sln --configuration Release --no-build

      - name: Build exact historical Core for M2av oracle
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          dotnet build src/HondaEcu.Core/HondaEcu.Core.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2av host C11 and independent differential tests (invented only)
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: ./research/p28-word0196/run-host-tests.ps1 -RunTag ci

      - name: M2aw target ABI contract and invented-only regressions
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_target_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/target_contract_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2ax toolchain provenance and invented-only regressions
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_toolchain_provenance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/toolchain_provenance_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2ay ASM662 source policy and invented-only safety regressions
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_asm662_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/asm662_source_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2az ASM662 original release provenance and invented-only regressions
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_asm662_original_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/asm662_original_release_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2ba Doc contribution provenance and invented-only regressions
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_doc_contribution.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/doc_contribution_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2ba independent encoder design and invented-only regressions
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_independent_encoder_design.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/independent_encoder_design_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bb independent typed encoder and primary-vector regressions
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_independent_encoder_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/independent_encoder_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bc independent decoder and bidirectional primary-vector compatibility
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_independent_decode_encode_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/independent_decoder_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bd typed lowering contract and static dataflow obligations
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_typed_lowering_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/typed_lowering_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2be invented-only layout geometry and branch feasibility
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_layout_feasibility_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/layout_feasibility_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bf external continuation and primary transfer-form evidence
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_external_continuation_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/continuation_transfer_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bg independent direct-J primary encoding and bidirectional codec checks
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_direct_j_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/direct_j_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bh invented-only static two-J composition and independent mathematical checks
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_static_composition_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/static_composition_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bi typed composite emission eligibility (static only, no emission)
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_composite_emission_eligibility_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/composite_emission_eligibility_tests.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bj atomic in-memory synthetic composite primary and decode verification
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/validate_synthetic_composite_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bk bounded synthetic execution protocol (static only; no CPU execution)
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_synthetic_execution_protocol.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bl synthetic adapter feasibility (mathematical only; no CPU execution)
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_synthetic_adapter_feasibility_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bm research-only Rust adapter capabilities (invented microprobes; no composite execution)
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_synthetic_rust_adapter_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bn bounded synthetic composite execution (research-only representable PSW)
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_synthetic_composite_execution.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content .tmp/m2bn-public-evidence/build.stderr.log
          Get-Content .tmp/m2bn-public-evidence/tests.stdout.log
          Get-Content .tmp/m2bn-public-evidence/tests.stderr.log

      - name: Preserve M2bn public-safe canonical semantic evidence
        uses: actions/upload-artifact@v4
        with:
          name: M2bn-canonical-${{ matrix.os }}
          path: |
            .tmp/m2br-owned/trees/m2bo/.tmp/m2bn-public-evidence/canonical.jsonl.gz
            .tmp/m2br-owned/trees/m2bo/.tmp/m2bn-public-evidence/summary.json
            .tmp/m2br-owned/trees/m2bo/.tmp/m2bn-public-evidence/pre-runtime-freeze.json
          if-no-files-found: error
          retention-days: 3

      - name: M2bo real production exec single-step differential verification (research only)
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bo
        run: |
          python -B research/p28-word0196/validate_production_exec_parity.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve M2bo public-safe canonical semantic evidence
        uses: actions/upload-artifact@v4
        with:
          name: M2bo-canonical-${{ matrix.os }}
          path: |
            .tmp/m2br-owned/trees/m2bo/.tmp/m2bo-public-evidence/canonical.jsonl.gz
            .tmp/m2br-owned/trees/m2bo/.tmp/m2bo-public-evidence/summary.json
            .tmp/m2br-owned/trees/m2bo/.tmp/m2bo-public-evidence/pre-runtime-freeze.json
          if-no-files-found: error
          retention-days: 3

      - name: M2bp pinned default-mode actual base-vs-pinned differential
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bp
        run: |
          python -B research/p28-word0196/default_mode_compatibility.py --baseline-root ../m2bo --active-root . --output-dir .tmp/m2bp-public-evidence/default --target-dir .tmp/m2bp-default-target --execute-freeze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bp pinned opt-in actual one-step production audit
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bp
        run: |
          python -B research/p28-word0196/validate_production_optin_capabilities.py --historical-root ../m2bo --output-dir .tmp/m2bp-public-evidence/optin --target-dir .tmp/m2bp-optin-target --execute-freeze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve M2bp public-safe default and opt-in canonical evidence
        uses: actions/upload-artifact@v4
        with:
          name: M2bp-canonical-${{ matrix.os }}
          path: |
            .tmp/m2br-owned/trees/m2bp/.tmp/m2bp-public-evidence/default/canonical.jsonl.gz
            .tmp/m2br-owned/trees/m2bp/.tmp/m2bp-public-evidence/default/summary.json
            .tmp/m2br-owned/trees/m2bp/.tmp/m2bp-public-evidence/default/pre-runtime-freeze.json
            .tmp/m2br-owned/trees/m2bp/.tmp/m2bp-public-evidence/optin/canonical.jsonl.gz
            .tmp/m2br-owned/trees/m2bp/.tmp/m2bp-public-evidence/optin/summary.json
            .tmp/m2br-owned/trees/m2bp/.tmp/m2bp-public-evidence/optin/pre-runtime-freeze.json
          if-no-files-found: error
          retention-days: 3

      - name: M2bq active default and exact M2bp one-step compatibility
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bq
        run: |
          python -B research/p28-word0196/production_composite_compatibility.py --historical-root ../m2bo --pinned-root ../m2bp --output-dir .tmp/m2bq-public-evidence/compatibility --target-dir .tmp/m2bq-optin-target --composite-freeze .tmp/m2bq-public-evidence/composite/pre-runtime-freeze.json --pinned-optin-output ../m2bp/.tmp/m2bp-public-evidence/optin --execute-freeze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bq full5470 production Cpu Bus decoder exec composite and negative runtime
        shell: pwsh
        working-directory: .tmp/m2br-owned/trees/m2bq
        run: |
          python -B research/p28-word0196/validate_production_composite.py --historical-root ../m2bo --pinned-root ../m2bp --output-dir .tmp/m2bq-public-evidence/composite --target-dir .tmp/m2bq-runtime-target --execute-freeze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve M2bq full default and one-step compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: M2bq-compatibility-${{ matrix.os }}
          path: |
            .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/compatibility/canonical.jsonl.gz
            .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/compatibility/summary.json
            .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/compatibility/pre-runtime-freeze.json
            .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/compatibility/default/canonical.jsonl.gz
            .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/compatibility/default/summary.json
            .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/compatibility/default/pre-runtime-freeze.json
            .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/compatibility/one-step/canonical.jsonl.gz
          if-no-files-found: error
          retention-days: 3

      - name: Preserve M2bq positive and negative canonical source-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: M2bq-composite-${{ matrix.os }}
          path: |
            .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/composite/positive-canonical.jsonl.gz
            .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/composite/negative-canonical.jsonl.gz
            .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/composite/summary.json
            .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/composite/pre-runtime-freeze.json
            .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/composite/source-transition.json
          if-no-files-found: error
          retention-days: 3

      - name: M2br actual active default one-step and full M2bq composite compatibility
        shell: pwsh
        run: |
          python -B research/p28-word0196/production_transfer_compatibility.py --pinned-root .tmp/m2br-owned/trees/m2bq --pinned-m2bp-root .tmp/m2br-owned/trees/m2bp --historical-root .tmp/m2br-owned/trees/m2bo --output-dir .tmp/m2br-owned/public-evidence/compatibility --target-dir .tmp/m2br-owned/targets/compatibility --pinned-compatibility-output .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/compatibility --pinned-composite-output .tmp/m2br-owned/trees/m2bq/.tmp/m2bq-public-evidence/composite --transfer-expectation-lock .tmp/m2br-owned/public-evidence/transfer/independent-expectation-lock.json --execute-freeze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2br production three-stage smoke4 full5470 transfer and negative58 verification
        shell: pwsh
        run: |
          python -B research/p28-word0196/validate_production_transfer.py --historical-root .tmp/m2br-owned/trees/m2bo --pinned-bp-root .tmp/m2br-owned/trees/m2bp --pinned-bq-root .tmp/m2br-owned/trees/m2bq --output-dir .tmp/m2br-owned/public-evidence/transfer --target-dir .tmp/m2br-owned/runtime-target/transfer --m2bq-canonical .tmp/m2br-owned/public-evidence/compatibility/composite/active-positive-canonical.jsonl.gz --m2bq-summary .tmp/m2br-owned/public-evidence/compatibility/composite/summary.json --m2bq-freeze .tmp/m2br-owned/public-evidence/compatibility/composite/pre-runtime-freeze.json --execute-freeze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2br opt-in Rust tests and all13 transfer guard components after actual corpus
        shell: pwsh
        run: |
          cargo +1.85.1 test --release --locked --manifest-path rust/p28-slice-runner/Cargo.toml --features p28-word0196-audit 2>&1 | Tee-Object -FilePath m2br-optin-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $taskSummaries = @(Select-String -LiteralPath m2br-optin-tests.log -Pattern '^test result: (\w+)\.\s+(\d+) passed;\s+(\d+) failed;\s+(\d+) ignored;\s+(\d+) measured;\s+(\d+) filtered out;')
          if ($taskSummaries.Count -eq 0) { throw 'Actual Rust summaries missing.' }
          $taskActualPassed = 0
          foreach ($taskRow in $taskSummaries) {
            $taskGroups = $taskRow.Matches[0].Groups
            if ($taskGroups[1].Value -cne 'ok' -or [int]$taskGroups[3].Value -ne 0 -or [int]$taskGroups[4].Value -ne 0 -or [int]$taskGroups[5].Value -ne 0 -or [int]$taskGroups[6].Value -ne 0) { throw 'Rust failures/ignored/measured/filtered tests are not accepted.' }
            $taskActualPassed += [int]$taskGroups[2].Value
          }
          if ($taskActualPassed -ne 359) { throw 'Actual opt-in test total differs from frozen346+13 inventory.' }
          $taskRequired = @(
            'audit_bus::transfer_tests::transfer_component_closed_stage_nodes_and_prefix_offsets',
            'audit_bus::transfer_tests::transfer_component_caller_authority_requires_actual_direct_j_target',
            'audit_bus::transfer_tests::transfer_component_pending_denies_execution_program_seed_and_data',
            'audit_bus::transfer_tests::transfer_component_claim_mutations_cannot_select_mapping',
            'audit_bus::transfer_tests::transfer_component_live_cpu_ram_and_journal_tampering_refused',
            'audit_bus::transfer_tests::transfer_component_opaque_owner_prevents_cross_session_ticket',
            'audit_bus::transfer_tests::transfer_component_single_use_and_duplicate_handle_requests_refused',
            'audit_bus::transfer_tests::transfer_component_pending_handle_claim_is_not_an_execution_permission',
            'audit_bus::transfer_tests::transfer_component_program_callback_bounds_and_selected_fetch_guard',
            'audit_bus::transfer_tests::transfer_component_prior_stage_program_associations_are_immutable',
            'audit_bus::transfer_tests::transfer_component_stale_rmw_read_cannot_authorize_next_instruction',
            'audit_bus::transfer_tests::transfer_component_global_budget_and_counters_survive_commit',
            'audit_bus::transfer_tests::transfer_component_continuation_checkpoint_seals_without_extra_fetch'
          )
          foreach ($taskName in $taskRequired) {
            if (@(Select-String -LiteralPath m2br-optin-tests.log -SimpleMatch ('test ' + $taskName + ' ... ok')).Count -ne 1) { throw ('Actual component test missing or duplicated: ' + $taskName) }
          }
          Write-Host ('Actual opt-in tests: ' + $taskActualPassed + '; actual transfer components: ' + $taskRequired.Count)
          cargo +1.85.1 fmt --check --manifest-path research/p28-word0196/rust-production-transfer/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify complete M2br eight-scope canonical artifact membership
        shell: pwsh
        run: |
          $taskRequired = @(
            '.tmp/m2br-owned/public-evidence/compatibility/historical-pinned-canonical.jsonl.gz',
            '.tmp/m2br-owned/public-evidence/compatibility/default/canonical.jsonl.gz',
            '.tmp/m2br-owned/public-evidence/compatibility/one-step/canonical.jsonl.gz',
            '.tmp/m2br-owned/public-evidence/compatibility/composite/canonical.jsonl.gz',
            '.tmp/m2br-owned/public-evidence/compatibility/source-transition-canonical.jsonl.gz',
            '.tmp/m2br-owned/public-evidence/compatibility/summary.json',
            '.tmp/m2br-owned/public-evidence/compatibility/pre-runtime-freeze.json',
            '.tmp/m2br-owned/public-evidence/compatibility/composite/active-positive-canonical.jsonl.gz',
            '.tmp/m2br-owned/public-evidence/compatibility/composite/summary.json',
            '.tmp/m2br-owned/public-evidence/compatibility/composite/pre-runtime-freeze.json',
            '.tmp/m2br-owned/public-evidence/transfer/admission-canonical.jsonl.gz',
            '.tmp/m2br-owned/public-evidence/transfer/positive-canonical.jsonl.gz',
            '.tmp/m2br-owned/public-evidence/transfer/negative-canonical.jsonl.gz',
            '.tmp/m2br-owned/public-evidence/transfer/summary.json',
            '.tmp/m2br-owned/public-evidence/transfer/pre-runtime-freeze.json',
            '.tmp/m2br-owned/public-evidence/transfer/independent-expectation-lock.json',
            '.tmp/m2br-owned/public-evidence/transfer/comparator-controls.json',
            '.tmp/m2br-owned/public-evidence/transfer/pure-protocol-tests.json'
          )
          foreach ($taskPath in $taskRequired) {
            if (-not (Test-Path -LiteralPath $taskPath -PathType Leaf)) { throw ('Missing required canonical evidence: ' + $taskPath) }
          }

      - name: Preserve M2br eight-scope public-safe canonical evidence
        uses: actions/upload-artifact@v4
        with:
          name: M2br-canonical-${{ matrix.os }}
          path: |
            .tmp/m2br-owned/public-evidence/compatibility/historical-pinned-canonical.jsonl.gz
            .tmp/m2br-owned/public-evidence/compatibility/default/canonical.jsonl.gz
            .tmp/m2br-owned/public-evidence/compatibility/one-step/canonical.jsonl.gz
            .tmp/m2br-owned/public-evidence/compatibility/composite/canonical.jsonl.gz
            .tmp/m2br-owned/public-evidence/compatibility/source-transition-canonical.jsonl.gz
            .tmp/m2br-owned/public-evidence/compatibility/summary.json
            .tmp/m2br-owned/public-evidence/compatibility/pre-runtime-freeze.json
            .tmp/m2br-owned/public-evidence/compatibility/composite/active-positive-canonical.jsonl.gz
            .tmp/m2br-owned/public-evidence/compatibility/composite/summary.json
            .tmp/m2br-owned/public-evidence/compatibility/composite/pre-runtime-freeze.json
            .tmp/m2br-owned/public-evidence/transfer/admission-canonical.jsonl.gz
            .tmp/m2br-owned/public-evidence/transfer/positive-canonical.jsonl.gz
            .tmp/m2br-owned/public-evidence/transfer/negative-canonical.jsonl.gz
            .tmp/m2br-owned/public-evidence/transfer/summary.json
            .tmp/m2br-owned/public-evidence/transfer/pre-runtime-freeze.json
            .tmp/m2br-owned/public-evidence/transfer/independent-expectation-lock.json
            .tmp/m2br-owned/public-evidence/transfer/comparator-controls.json
            .tmp/m2br-owned/public-evidence/transfer/pure-protocol-tests.json
          if-no-files-found: error
          retention-days: 3

      - name: Verify formatting
        run: dotnet format HondaEcu.sln --verify-no-changes --no-restore

      - name: Switch same checkout to active M2bs source after all historical gates
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: false
          fetch-depth: 0
          persist-credentials: false

      - name: Active M2bs source integrity and unchanged production input guard
        shell: pwsh
        run: |
          python -B research/p28-word0196/original_rom_boundary/source_guard.py --expected-head "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Active M2bs public synthetic boundary and negative regressions
        shell: pwsh
        run: |
          python -B -m unittest discover -s research/p28-word0196/original_rom_boundary -p '*_tests.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Reject tracked private and binary artifacts
        shell: pwsh
        run: |
          $forbidden = @(git ls-files -- '*.bin' '*.rom' '*.hex' '*.eep' '*.dump' '*.gzf' '*.rep' '*.gpr' '*.gpr.bak' '*.db' '*.trace' '*.exe' '*.dll' '*.pdb' '*.zip' 'artifacts/**')
          $private = @(git ls-files -- 'private/**' | Where-Object { $_ -notmatch '/\.gitkeep$' })
          if ($forbidden.Count -gt 0 -or $private.Count -gt 0) { throw 'Forbidden public artifacts are tracked.' }

      - name: Set up and build pinned Rust runner for integration tests
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          cargo +1.85.1 build --release --locked --manifest-path rust/p28-slice-runner/Cargo.toml

      - name: Restore Windows-only solution
        run: dotnet restore HondaEcu.Windows.sln

      - name: Build Windows desktop (Release)
        run: dotnet build HondaEcu.Windows.sln --configuration Release --no-restore

      - name: Test desktop contracts (synthetic only; not a GUI smoke test)
        run: dotnet test HondaEcu.Windows.sln --configuration Release --no-build

      - name: Verify Windows solution formatting
        run: dotnet format HondaEcu.Windows.sln --verify-no-changes --no-restore

      - name: Publish clean self-contained portable application
        shell: pwsh
        run: ./scripts/publish-desktop.ps1 -OutputPath artifacts/desktop/win-x64-d2-verified

      - name: Check portable startup outside repository (no-window diagnostic, not GUI smoke)
        shell: pwsh
        run: ./scripts/test-desktop-portable.ps1 -PortablePath artifacts/desktop/win-x64-d2-verified

      - name: Upload portable Windows preview (no ROM or private reports)
        uses: actions/upload-artifact@v4
        with:
          name: HondaEcu-Desktop-Research-Preview-win-x64-d2
          path: artifacts/desktop/win-x64-d2-verified/
          if-no-files-found: error
          retention-days: 14
