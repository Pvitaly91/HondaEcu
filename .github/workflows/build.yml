      - name: Verify pinned M2bz source and its unchanged seventeen-job CI projection
        shell: pwsh
        run: |
          python -B research/p28-word0196/native_post_return_selector/source_guard.py --expected-head "f77d2cc1468fe128ba4ad393c3e0a1a5dab423fc"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bz independent P2 oracle ownership admission and resume regressions
        shell: pwsh
        run: |
          python -B -m unittest discover -s research/p28-word0196/native_post_return_selector -t research/p28-word0196 -p '*_tests.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Fetch exact locked M2bz dependencies
        shell: pwsh
        run: |
          cargo +1.85.1 fetch --locked --manifest-path rust/p28-slice-runner/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bz current-source default-off and complete old-plus-P2 Rust regressions
        shell: pwsh
        run: |
          python -B research/p28-word0196/native_post_return_selector/build_guard.py --ci-cargo-preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.85.1 test --release --locked --offline --jobs 1 --manifest-path rust/p28-slice-runner/Cargo.toml --target-dir .tmp/m2bz-owned/cargo-target --no-default-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B research/p28-word0196/native_post_return_selector/build_guard.py --ci-cargo-preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.85.1 test --release --locked --offline --jobs 1 --manifest-path rust/p28-slice-runner/Cargo.toml --target-dir .tmp/m2bz-owned/cargo-target --no-default-features --features p28-word0196-post-return-selector-continuity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.85.1 fmt --check --manifest-path rust/p28-slice-runner/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build required-feature M2bz P2 runner in owned target
        shell: pwsh
        run: |
          python -B research/p28-word0196/native_post_return_selector/build_guard.py --ci-cargo-preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.85.1 build --release --locked --offline --jobs 1 --manifest-path rust/p28-slice-runner/Cargo.toml --target-dir .tmp/m2bz-owned/cargo-target --no-default-features --features p28-word0196-post-return-selector-continuity --bin m2bz-post-return-selector
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M2bz actual public continuous predecessor algorithm and CAL-body-RT plus eight post-return selector instructions execution
        shell: pwsh
        run: |
          $taskRunner = '.tmp/m2bz-owned/cargo-target/release/m2bz-post-return-selector'
          if ($IsWindows) { $taskRunner += '.exe' }
          python -B research/p28-word0196/validate_native_post_return_selector.py --public --output .tmp/m2bz-public-evidence --runner $taskRunner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify closed M2bz public artifact membership
        shell: pwsh
        run: |
          $taskRequired = @('canonical.jsonl.gz', 'summary.json', 'pre-runtime-freeze.json', 'sourcejoin.json')
          $taskActual = @(Get-ChildItem -LiteralPath '.tmp/m2bz-public-evidence' -Force)
          if ($taskActual.Count -ne 4) { throw 'Unexpected M2bz artifact membership.' }
          foreach ($taskName in $taskRequired) {
            if (-not (Test-Path -LiteralPath (Join-Path '.tmp/m2bz-public-evidence' $taskName) -PathType Leaf)) { throw 'Missing M2bz artifact member.' }
          }

      - name: Preserve only public invented M2bz canonical evidence
        uses: actions/upload-artifact@v4
        with:
          name: M2bz-public-canonical-${{ matrix.os }}
          path: |
            .tmp/m2bz-public-evidence/canonical.jsonl.gz
            .tmp/m2bz-public-evidence/summary.json
            .tmp/m2bz-public-evidence/pre-runtime-freeze.json
            .tmp/m2bz-public-evidence/sourcejoin.json
          if-no-files-found: error
          retention-days: 14

  desktop-windows:
    needs: ci-routing
    if: ${{ always() && (needs.ci-routing.result != 'success' || needs.ci-routing.outputs.full_qa != 'false') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Reject tracked private and binary artifacts
        shell: pwsh
        run: |
          $forbidden = @(git ls-files -- '*.bin' '*.rom' '*.hex' '*.eep' '*.dump' '*.gzf' '*.rep' '*.gpr' '*.gpr.bak' '*.db' '*.trace' '*.exe' '*.dll' '*.pdb' '*.zip' 'artifacts/**')
          $private = @(git ls-files -- 'private/**' | Where-Object { $_ -notmatch '/\.gitkeep$' })
          if ($forbidden.Count -gt 0 -or $private.Count -gt 0) { throw 'Forbidden public artifacts are tracked.' }

      - name: Set up and build pinned Rust runner for integration tests
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt
          cargo +1.85.1 build --release --locked --manifest-path rust/p28-slice-runner/Cargo.toml

      - name: Restore Windows-only solution
        run: dotnet restore HondaEcu.Windows.sln

      - name: Build Windows desktop (Release)
        run: dotnet build HondaEcu.Windows.sln --configuration Release --no-restore

      - name: Test desktop contracts (synthetic only; not a GUI smoke test)
        run: dotnet test HondaEcu.Windows.sln --configuration Release --no-build

      - name: Verify Windows solution formatting
        run: dotnet format HondaEcu.Windows.sln --verify-no-changes --no-restore

      - name: Publish clean self-contained portable application
        shell: pwsh
        run: ./scripts/publish-desktop.ps1 -OutputPath artifacts/desktop/win-x64-d2-verified

      - name: Check portable startup outside repository (no-window diagnostic, not GUI smoke)
        shell: pwsh
        run: ./scripts/test-desktop-portable.ps1 -PortablePath artifacts/desktop/win-x64-d2-verified

      - name: Upload portable Windows preview (no ROM or private reports)
        uses: actions/upload-artifact@v4
        with:
          name: HondaEcu-Desktop-Research-Preview-win-x64-d2
          path: artifacts/desktop/win-x64-d2-verified/
          if-no-files-found: error
          retention-days: 14
