name: build

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reject tracked ROM and reverse-engineering artifacts
        shell: pwsh
        run: |
          $forbidden = @(git ls-files -- '*.bin' '*.rom' '*.hex' '*.eep' '*.dump' '*.gzf' '*.rep' '*.gpr' '*.gpr.bak' '*.db' '*.trace')
          if ($forbidden.Count -gt 0) {
            throw "Forbidden public artifacts are tracked: $($forbidden -join ', ')"
          }

      - name: Restore
        run: dotnet restore

      - name: Set up pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt

      - name: Rust build and instruction tests (synthetic only)
        run: |
          cargo +1.85.1 build --release --locked --manifest-path rust/p28-slice-runner/Cargo.toml
          cargo +1.85.1 test --release --locked --manifest-path rust/p28-slice-runner/Cargo.toml

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test .NET and real Rust process end-to-end (synthetic only)
        run: dotnet test --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format --verify-no-changes
