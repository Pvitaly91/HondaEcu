[package]
name = "p28-research-production-composite"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
publish = false

[[bin]]
name = "m2bq-production-composite"
path = "src/main.rs"

[dependencies]
p28-slice-runner = { path = "../../../rust/p28-slice-runner", features = ["p28-word0196-audit"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"

[profile.release]
overflow-checks = true
