[package]
name = "p28-slice-runner"
version = "0.43.0"
edition = "2021"
rust-version = "1.85.1"
publish = false

[features]
default = []
p28-word0196-audit = []
p28-word0196-original-rom = ["p28-word0196-audit"]
p28-word0196-entry-continuity = ["p28-word0196-original-rom"]
p28-word0196-p2-handoff = ["p28-word0196-entry-continuity"]
p28-word0196-post-p2-control = ["p28-word0196-p2-handoff"]
p28-word0196-below-second-p2-continuity = ["p28-word0196-post-p2-control"]
p28-word0196-cal-rt-continuity = ["p28-word0196-below-second-p2-continuity"]

[[bin]]
name = "m2bt-original-rom"
path = "src/bin/m2bt_original_rom.rs"
required-features = ["p28-word0196-original-rom"]

[[bin]]
name = "m2bu-entry-continuity"
path = "src/bin/m2bu_entry_continuity.rs"
required-features = ["p28-word0196-entry-continuity"]

[[bin]]
name = "m2bv-p2-handoff"
path = "src/bin/m2bv_p2_handoff.rs"
required-features = ["p28-word0196-p2-handoff"]

[[bin]]
name = "m2bw-post-p2-control"
path = "src/bin/m2bw_post_p2_control.rs"
required-features = ["p28-word0196-post-p2-control"]

[[bin]]
name = "m2bx-below-second-p2"
path = "src/bin/m2bx_below_second_p2.rs"
required-features = ["p28-word0196-below-second-p2-continuity"]

[[bin]]
name = "m2by-cal-rt-continuity"
path = "src/bin/m2by_cal_rt_continuity.rs"
required-features = ["p28-word0196-cal-rt-continuity"]

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"

[profile.release]
overflow-checks = true
